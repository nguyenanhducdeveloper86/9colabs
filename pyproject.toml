[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "9colab"
version = "0.1.0"
description = "Multi-account controller, failover router, and parallel runner for google-colab-cli"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nguyen Anh Duc" }]
keywords = ["google-colab", "colab-cli", "gpu", "multi-account", "cli"]
dependencies = []

[project.urls]
Homepage = "https://github.com/nguyenanhducdeveloper86/9colabs"
Repository = "https://github.com/nguyenanhducdeveloper86/9colabs"

[project.scripts]
9colab = "ninecolab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
